[project]
name = "salesonboard"
version = "0.1.0"
description = "Sales ETL Agent: maps a customer's sales export into one canonical table."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, SIM: simpler code
select = ["E", "F", "I", "B", "UP", "SIM"]
